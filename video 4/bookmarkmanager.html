<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager -UTKARSH TIWARI</title>
    <link rel="stylesheet" href="bookmanager.css">
</head>
<body>
    
    <h1 style="color: rgb(0, 0, 0); border-style: solid;background-color: antiquewhite;" > My Bookmark using h1</h1>
    <a style="background-color: aliceblue;border-style:double;" target="_blank" href="https://www.amazon.in/">open AMAZON shopping website</a>
    <h2 style="background-color: antiquewhite;border-style: dotted;"> My Bookmark using h2</h2>
    <a style="border-style: double; background-color: aliceblue;" target="_blank" href="https://www.google.com/">open google</a>
    <h3> My Bookmark using h3</h3>
    <a style="background-color: aliceblue;border-style: ridge;" target="_blank" href="https://www.facebook.com">Open facebook</a><br>
    <h4 style="background-color: antiquewhite; border-style:inset;"> My Bookmark using h4</h4>
    <a style="background-color: aliceblue;border-style: solid; border-color: black;" target="_blank" href="https://www.flipkart.com/">Open flipkart</a><br>
    <br>
    <a style="background-color: aliceblue ;border-style: dashed;border-color: brown;" target="_blank" href="https://www.youtube.com/">Open youtube</a><br>
    <br>
    <a style="background-color: aliceblue;border-style: double;border-color: crimson;" target="_blank" href="https://www.myntra.com/">Open myntra</a><br>
    
</body>
</html>
