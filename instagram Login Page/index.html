<!DOCTYPE html>
<html lang="en">
<head>

    <title>Instagram Login Page clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="instagram-logo.png" alt="Instagram" style="width: 350px;  ">
        <form>
            <input type="text" placeholder="Phone number,username, or email">

            <button type="submit">Log In</button>
            <div class="or">OR</div>
            <a href="#" class="facebook">Log in with facebook</a>
            <div class="signup">
            Don't have a account? <a href="sign in">sign in</a>
            </div>
        </form>
    </div>
</body>
</html>
